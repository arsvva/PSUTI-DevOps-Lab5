server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker (решает проблему с host not found)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host http://backend:8000;

    # Раздача статики
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на бэкенд
    location /api/ {
        proxy_pass $backend_host$request_uri;
        proxy_set_header Host $http_host;
    }

    # Проксирование документации
    location ~ ^/(docs|redoc|openapi\.json|health)(/|$) {
        proxy_pass $backend_host$request_uri;
        proxy_set_header Host $http_host;
    }
}
